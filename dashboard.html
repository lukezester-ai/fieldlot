<!doctype html>
<html lang="bg">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Моят профил — Fieldlot</title>
	<meta name="description" content="Управление на вашите обяви във Fieldlot." />
	
	<script src="/scripts/fieldlot-theme.js"></script>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
	
	<link rel="stylesheet" href="/styles/fieldlot-theme.css" />
	<link rel="stylesheet" href="/styles/fieldlot-ui.css" />
	<link rel="stylesheet" href="/styles/fieldlot-catalog.css" />
	<link rel="stylesheet" href="/styles/fieldlot-yellow-pages.css" />
	<link rel="stylesheet" href="/styles/fieldlot-auth.css" />
	<link rel="stylesheet" href="/styles/fieldlot-mobile.css" />

	<style>
		.dashboard-layout {
			display: flex;
			gap: 2rem;
			margin-top: 3rem;
			min-height: 60vh;
		}
		.dashboard-sidebar {
			width: 250px;
			flex-shrink: 0;
		}
		.dashboard-nav {
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
			background: var(--paper);
			padding: 1rem;
			border-radius: var(--radius-lg);
			box-shadow: var(--shadow-sm);
			border: 1px solid var(--line);
		}
		.dashboard-nav a {
			padding: 0.8rem 1rem;
			text-decoration: none;
			color: var(--muted);
			font-weight: 500;
			border-radius: var(--radius-md);
			transition: all 0.2s;
		}
		.dashboard-nav a:hover {
			background: var(--soft);
			color: var(--fl-brand-solid);
		}
		.dashboard-nav a.active {
			background: var(--fl-brand-soft);
			color: var(--fl-brand-deep);
			font-weight: 600;
		}
		.dashboard-content {
			flex: 1;
		}
		.dashboard-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 2rem;
			padding-bottom: 1rem;
			border-bottom: 1px solid var(--line);
		}
		.dashboard-header h1 {
			margin: 0;
			font-size: 2rem;
			color: var(--ink);
		}
		
		@media (max-width: 768px) {
			.dashboard-layout {
				flex-direction: column;
			}
			.dashboard-sidebar {
				width: 100%;
			}
			.dashboard-nav {
				flex-direction: row;
				overflow-x: auto;
			}
			.dashboard-header {
				flex-direction: column;
				align-items: flex-start;
				gap: 1rem;
			}
		}
	</style>
</head>
<body>
	<header class="site-header">
		<nav class="nav" aria-label="Основна навигация">
			<a class="brand" href="/">
				<span class="brand-mark" aria-hidden="true">
					<svg width="23" height="23" viewBox="0 0 24 24" fill="none">
						<path d="M6 15c5.8.4 9.5-2.8 11.4-8.9C11.1 6 6.8 9.3 6 15Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
					</svg>
				</span>
				<span>
					<span class="brand-title">FIELDLOT</span>
					<span class="brand-sub">Agro market access</span>
				</span>
			</a>
			<div style="display: flex; gap: 8px; align-items: center;">
				<button type="button" class="theme-toggle" onclick="window.FieldlotTheme.toggleTheme()" aria-label="Toggle Dark Mode">
					<svg viewBox="0 0 24 24"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.758a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z"/></svg>
				</button>
			</div>
			
			<div class="nav-links">
				<a href="/">Начало</a>
				<a href="/catalog.html">Каталог</a>
				<a href="/logistics.html">Логистика</a>
			</div>
			<div class="header-actions" style="display:flex; align-items:center; gap: 8px;">
				<!-- Auth JS ще инжектира логин статуса тук -->
			</div>
		</nav>
	</header>

	<main class="container">
		<div class="dashboard-layout">
			<aside class="dashboard-sidebar">
				<nav class="dashboard-nav">
					<a href="#listings" class="active" id="tab-listings">Моите обяви</a>
					<a href="#profile" id="tab-profile">Настройки на профила</a>
				</nav>
			</aside>
			
			<section class="dashboard-content">
				<div id="view-listings">
					<div class="dashboard-header">
						<h1>Моите обяви</h1>
						<button class="btn btn-primary" id="btn-new-listing" style="border-radius: 40px;">+ Нова обява</button>
					</div>
					
					<div id="dashboard-yp-board catalog-grid" class="yp-board catalog-grid" aria-live="polite">
						<p class="meta" style="grid-column: 1 / -1;">Зареждане на обявите ви...</p>
					</div>
				</div>

				<div id="view-profile" style="display: none;">
					<div class="dashboard-header">
						<h1>Настройки на профила</h1>
					</div>
					<div style="background: var(--paper); padding: 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--line);">
						<form id="profile-form" style="display: flex; flex-direction: column; gap: 1.5rem; max-width: 600px;">
							<div style="display: flex; flex-wrap: wrap; gap: 1rem;">
								<div style="flex: 1; min-width: 250px;">
									<label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--muted);">Имейл адрес (не може да се променя)</label>
									<input type="email" id="profile-email" disabled style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); color: var(--ink);" />
								</div>
								<div style="flex: 1; min-width: 250px;">
									<label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--muted);">Име на стопанството / Фирма</label>
									<input type="text" id="profile-company" placeholder="Въведете име..." style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);" />
								</div>
							</div>
							
							<div>
								<label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--muted);">Основна дейност</label>
								<select id="profile-type" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);">
									<option value="">Изберете дейност...</option>
									<option value="grain">Зърнопроизводител</option>
									<option value="veg">Зеленчукопроизводител</option>
									<option value="fruit">Овощарство</option>
									<option value="livestock">Животновъд</option>
									<option value="trader">Търговец / Логистика</option>
									<option value="other">Друго</option>
								</select>
							</div>

							<div>
								<label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--muted);">Описание на стопанството / История</label>
								<textarea id="profile-desc" rows="4" placeholder="Разкажете накратко за вашето стопанство, от колко време сте на пазара, с какво се гордеете..." style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-family: inherit; resize: vertical;"></textarea>
							</div>

							<div>
								<label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--muted);">Сертификати и Стандарти</label>
								<div style="display: flex; flex-wrap: wrap; gap: 1rem; padding: 0.5rem 0;">
									<label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;"><input type="checkbox" name="certs" value="globalgap" /> GLOBALG.A.P</label>
									<label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;"><input type="checkbox" name="certs" value="bio" /> Био Сертифициран</label>
									<label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;"><input type="checkbox" name="certs" value="iso" /> ISO</label>
									<label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;"><input type="checkbox" name="certs" value="haccp" /> HACCP</label>
								</div>
							</div>

							<div style="display: flex; flex-wrap: wrap; gap: 1rem;">
								<div style="flex: 1; min-width: 250px;">
									<label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--muted);">Снимка / Лого</label>
									<input type="file" id="profile-image" accept="image/*" style="width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px dashed var(--line); background: var(--soft); color: var(--ink);" />
									<div id="profile-image-preview" style="margin-top: 10px; max-width: 150px; border-radius: 8px; overflow: hidden; display: none;">
										<img src="" alt="Preview" style="width: 100%; height: auto; display: block;" />
									</div>
								</div>
								<div style="flex: 1; min-width: 250px;">
									<label style="display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--muted);">Видео презентация (YouTube линк)</label>
									<input type="url" id="profile-video" placeholder="https://youtube.com/watch?v=..." style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink);" />
								</div>
							</div>

							<div style="margin-top: 1rem; padding: 1rem; background: var(--fl-brand-soft); border-radius: 8px; border: 1px solid var(--fl-brand-deep); color: var(--fl-brand-deep);">
								<label style="display: flex; align-items: flex-start; gap: 0.75rem; cursor: pointer; font-weight: 500;">
									<input type="checkbox" id="profile-public-consent" style="margin-top: 0.25rem; transform: scale(1.2);" />
									<span>
										<strong>Публичен профил</strong><br/>
										<small style="opacity: 0.9;">Съгласен съм горната информация (описание, сертификати, снимки) да се показва в моите обяви като "Етикет на доверие", за да привлече повече купувачи.</small>
									</span>
								</label>
							</div>

							<button type="submit" class="btn btn-primary" id="btn-save-profile" style="border-radius: 40px; padding: 1rem; width: 100%; font-size: 1.1rem; margin-top: 0.5rem;">Запази промените</button>
						</form>
					</div>
				</div>
			</section>
		</div>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p>© Fieldlot · Табло</p>
			<p>Контакт: <a href="mailto:info@agrinexus.eu">info@agrinexus.eu</a> · <a href="/">Към началото</a></p>
		</div>
	</footer>

	<button type="button" class="llm-launch" id="llm-fab" aria-expanded="false" aria-controls="llm-panel">AI Guide</button>
	<div class="llm-panel" id="llm-panel" role="dialog" aria-label="Fieldlot Guide" aria-modal="false">
		<div class="llm-head">
			<div><strong>Fieldlot Guide</strong><span class="llm-status" id="llm-status">…</span></div>
			<button type="button" class="llm-close" id="llm-close" data-i18n-aria="nav.close" aria-label="Затвори">×</button>
		</div>
		<div class="llm-msgs" id="llm-msgs" aria-live="polite"></div>
		<p class="llm-hint" data-i18n="chat.hint">RAG · категории, култури · качи снимка</p>
		<div class="llm-quick" id="llm-quick" role="group" aria-label="Бързи въпроси">
			<button type="button" class="llm-quick-btn" data-prompt="Напиши обява за продажба на пшеница: 80 т, Добруджа, FCA, хлебен индекс ~58" data-i18n="chat.quickDraft">Нова обява</button>
			<button type="button" class="llm-quick-btn" data-prompt="Редактирай последната обява — направи текста по-кратък и по-професионален" data-i18n="chat.quickEdit">Редакция</button>
			<button type="button" class="llm-quick-btn" data-prompt="Покажи обяви за ечемик в каталога" data-i18n="chat.quickBarley">Ечемик</button>
		</div>
		<div class="llm-foot">
			<input type="file" id="llm-photo" accept="image/jpeg,image/png,image/webp" hidden />
			<button type="button" class="llm-photo" id="llm-photo-btn" title="Качи снимка" aria-label="Снимка" data-i18n-aria="chat.photoBtn">+</button>
			<textarea id="llm-input" rows="2" maxlength="2000" data-i18n-placeholder="chat.placeholder" placeholder="Напр. Каква е цената на пшеницата?"></textarea>
			<button type="button" class="llm-send" id="llm-send" data-i18n-aria="chat.send" aria-label="Изпрати">→</button>
		</div>
	</div>

	<script src="/scripts/fieldlot-i18n-messages.js"></script>
	<script src="/scripts/fieldlot-i18n.js"></script>
	<script src="/scripts/fieldlot-api-status.js"></script>
	<script src="/scripts/fieldlot-images.js"></script>
	<script src="/scripts/fieldlot-categories.js"></script>
	<script type="module" src="/firebase-init.js"></script>
	<script type="module" src="/auth-ui.js"></script>
	<script type="module" src="/publish-ui.js"></script>
	<script type="module" src="/scripts/dashboard-page.js"></script>
	<script src="/scripts/fieldlot-chat.js"></script>
	<script>
		FieldlotChat.mount({
			page: 'dashboard',
			openTriggers: ['llm-fab'],
		});
	</script>
</body>
</html>
